version: "3.9"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: guard24-bot:latest
    container_name: guard24-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://host.docker.internal:27017/guard24}
    ports:
      - "${PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
